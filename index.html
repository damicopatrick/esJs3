<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body class="text-center">
    <h1>CONVERTITORE DI VALUTA</h1>
    <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" value="" id="checkNativeSwitch" switch>
        <label class="form-check-label" for="checkNativeSwitch">
            dark mode
        </label>
    </div>
    <form>
        <img src="./img/unioneEuropea.svg" class="my-3">
        <br>
        <input type="number" placeholder="inserisci €" oninput="inputEuro()" id="numeroEuro">
    </form>
        <div class="container text-center">
            <div class="row">
                <div class="col-sm-4">
                    <p>USA</p>
                    <img src="./img/USAflag.webp">
                    <p><span id="valutaUSA">$</span></p>
                </div>
                <div class="col-sm-4">
                    <p>UK</p>
                    <img src="./img/UKflag.webp">
                    <p><span id="valutaUK">£</span></p>
                </div>
                <div class="col-sm-4">
                    <p>Giappone</p>
                    <img src="./img/JapanFlag.webp" class="border">
                    <p><span id="valutaJPN">¥</span></p>
                </div>
            </div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>
</body>

</html>
